name: quality

on:
  push:
  pull_request:

jobs:
  non-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck gawk
      - name: Run P0-P10 quality gate
        run: ./tests/run.sh --require-shellcheck
