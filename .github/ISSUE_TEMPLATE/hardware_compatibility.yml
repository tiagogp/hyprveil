name: Hardware compatibility
description: Record Fedora, GPU, display, Wi-Fi, Bluetooth, or power-profile behavior.
title: "[Hardware]: "
labels: ["hardware"]
body:
  - type: input
    id: commit
    attributes:
      label: Hyprveil commit
      description: Run `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: fedora
    attributes:
      label: Fedora release
      options:
        - Fedora 44
        - Fedora 43
        - Other
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: Model, GPU, Wi-Fi/Bluetooth chipset, display layout, scale, refresh rate, and laptop/desktop profile.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What worked, what failed, and which recovery commands were needed?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, `hyprctl monitors`, NetworkManager, Bluetooth, or power-profile output.
      render: text
