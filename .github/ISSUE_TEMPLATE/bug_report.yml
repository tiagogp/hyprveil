name: Bug report
description: Report a reproducible Hyprveil defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Hyprveil commit
      description: Run `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: fedora
    attributes:
      label: Fedora release
      options:
        - Fedora 44
        - Fedora 43
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Paste relevant `./tests/run.sh`, `scripts/03-test-config.sh`, or nested-session output.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include screenshots, logs, recovery steps, or hardware details when useful.
