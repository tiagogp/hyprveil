name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior, UI surface, command, or documentation change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or fallback behavior you considered.
  - type: checkboxes
    id: fit
    attributes:
      label: Project fit
      options:
        - label: This can degrade cleanly when optional hardware or services are unavailable.
        - label: This can use existing token, accent, surface, state, and recovery patterns.
