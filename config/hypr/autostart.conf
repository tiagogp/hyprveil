# exec-once entries. Grows as later stages add components — lines below are
# commented until the corresponding stage is installed, to avoid startup errors.

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Stage 2 (installed via scripts/02-install-fedora-shell.sh):
exec-once = waybar
# Pushes instant dock focus updates to Waybar (see waybar/scripts/dock-watch.sh);
# without it the dock falls back to its own polling interval.
exec-once = ~/.config/waybar/scripts/dock-watch.sh
exec-once = hyprpaper
# Reapplies the saved per-monitor selection once Hyprpaper's IPC is up; without
# it hyprpaper.conf carries no mappings and every login starts bare.
exec-once = ~/.config/hypr/scripts/wallpaper.sh restore
# Backend-aware notification daemon: AGS quick-settings panel by default, with
# SwayNC/Mako fallbacks (see hypr/scripts/notification-daemon.sh and the
# persisted $XDG_STATE_HOME/hyprveil/notification-backend choice).
exec-once = ~/.config/hypr/scripts/notification-daemon.sh start
exec-once = hypridle

# clipboard history for SUPER+V (cliphist + wl-clipboard, installed in Stage 2)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Stage 3: push GTK theme/cursor/fonts into gsettings so libadwaita apps match
exec-once = ~/.config/hypr/scripts/apply-theme.sh
