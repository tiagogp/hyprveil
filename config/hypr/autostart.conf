# exec-once entries. Grows as later stages add components — lines below are
# commented until the corresponding stage is installed, to avoid startup errors.

# polkit-gnome was dropped from Fedora and is unavailable from F42 onward, so
# the agent it shipped can no longer be installed. mate-polkit is the GTK
# replacement carried in the main repo; the binary lives in libexec, not on PATH.
exec-once = /usr/libexec/polkit-mate-authentication-agent-1

# Stage 2 (installed via scripts/02-install-fedora-shell.sh):
#
# The bar and dock are drawn by the shell selected below, not started here.
# Waybar and its dock-watch helper used to live at this point; both retired with
# the Quickshell migration. dock-watch.sh existed only because Waybar could not
# subscribe to Hyprland's event socket itself — Quickshell does, in-process, so
# there is nothing left to push.
exec-once = hyprpaper
# Reapplies the saved per-monitor selection once Hyprpaper's IPC is up; without
# it hyprpaper.conf carries no mappings and every login starts bare.
exec-once = ~/.config/hypr/scripts/wallpaper.sh restore
# Backend-aware shell + notification daemon. With the quickshell backend this is
# also what starts the bar, dock, and quick-settings panel — the shell IS the
# notification server, so one launch covers both. SwayNC and Mako remain
# selectable (see hypr/scripts/notification-daemon.sh and the persisted
# $XDG_STATE_HOME/hyprveil/notification-backend choice).
exec-once = ~/.config/hypr/scripts/notification-daemon.sh start
exec-once = hypridle

# clipboard history for SUPER+V (cliphist + wl-clipboard, installed in Stage 2)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Stage 3: push GTK theme/cursor/fonts into gsettings so libadwaita apps match
exec-once = ~/.config/hypr/scripts/apply-theme.sh
