# Idle daemon: lock at 10min, screen off at 15min, suspend at 30min.
# Adjust timeouts to taste; keep lock < dpms < suspend.

general {
    # lock.sh prefers the Quickshell lock and falls back to hyprlock whenever the
    # shell cannot be confirmed. pidof still guards against stacking lockers.
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
    # `;` not `&&`: brightness-save must still run if lock.sh doesn't confirm a
    # lock, since that's an unrelated failure mode. brightness-restore runs
    # before dpms on so the backlight register is already correct by the time
    # the panel becomes visible — see hardware-action.sh for why a suspend/
    # resume cycle needs this and a dpms cycle does not.
    before_sleep_cmd = ~/.config/hypr/scripts/lock.sh; ~/.config/hypr/scripts/hardware-action.sh brightness-save
    after_sleep_cmd = ~/.config/hypr/scripts/hardware-action.sh brightness-restore; hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/lock.sh
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
