# Machine-local overrides, sourced last so they win over the managed defaults.
#
# `hyprveil setup` regenerates this file from your saved monitor and keyboard
# choices, so it is overwritten on every deploy/update. To change these
# permanently, run `hyprveil setup` (interactive) or, for example:
#   ./hyprveil setup --monitor 'DP-1:2560x1440@144:0x0:1:primary' \
#       --monitor 'HDMI-A-1:1920x1080@60:2560x0:1' --kb-layout us
# Monitor lines here are matched by name and override monitors.conf; the
# input block is merged over hyprland.conf's, so kb_layout wins from here.
#
# A one-off manual edit survives until the next deploy or `setup --ensure`.
