# Restrained spatial motion for windows, workspaces, layers, and the scratchpad.
# Curves and durations come from tokens.conf so the GTK stylesheets can be
# rendered with the same easing — before, they used a plain `ease` and visibly
# disagreed with the compositor. Durations here are deciseconds ($ds-*).
#
# The profile drives the CHILD nodes rather than only the parents. Setting just
# `windows` makes an open, a close, and a tiling reflow all take the same 300ms,
# which is what made the desktop feel floaty: a reflow that lags the pointer by
# a third of a second reads as the compositor struggling, not as polish. The
# rule the ramp below encodes is that entrances may be expressive, exits should
# get out of the way, and anything tracking a user's hand should be immediate.
bezier = hyprveilSoftOut, $ease-out-points
bezier = hyprveilQuickEase, $ease-standard-points

animations {
    enabled = $hyprveil_animations_enabled

    # Entrance gets the long decelerating curve and the scale; the close is a
    # shorter, flatter pop so dismissing never feels like waiting. popin 92% on
    # the way out travels less distance than the 90% entry for the same reason.
    animation = windowsIn, 1, $ds-4, hyprveilSoftOut, popin 90%
    animation = windowsOut, 1, $ds-2, hyprveilQuickEase, popin 92%

    # Tiling reflow. This is the node that was silently inheriting 300ms, and it
    # is the one most worth having short — a window moving because its neighbour
    # opened should already be where it belongs by the time the eye arrives.
    animation = windowsMove, 1, $ds-2, hyprveilQuickEase

    animation = border, 1, $ds-4, hyprveilQuickEase
    animation = fade, 1, $ds-3, hyprveilQuickEase

    # Layer surfaces are the shell: bar, dock, quick settings, wallpaper picker.
    # `slide` takes its direction from the layer's own anchor, so each panel
    # enters from the edge it lives on instead of fading in place. That
    # directionality is what makes the shell read as sitting above the desktop
    # rather than being composited into it.
    animation = layersIn, 1, $ds-3, hyprveilSoftOut, slide
    animation = layersOut, 1, $ds-2, hyprveilQuickEase, slide
    animation = fadeLayers, 1, $ds-2, hyprveilQuickEase

    animation = workspaces, 1, $ds-3, hyprveilSoftOut, slide
    animation = specialWorkspace, 1, $ds-3, hyprveilSoftOut, slidevert
}
