# Restrained spatial motion for windows, workspaces, layers, and the scratchpad.
# Curves and durations come from tokens.conf so the GTK stylesheets can be
# rendered with the same easing. Durations here are deciseconds ($ds-*).
#
# This profile drives child nodes deliberately. Entrances get a small amount of
# character, exits get out of the way, and pointer-tracked reflow stays quick.
bezier = hyprveilSoftOut, $ease-out-points
bezier = hyprveilQuickEase, $ease-standard-points

animations {
    enabled = $hyprveil_animations_enabled

    # Small-scale pop keeps new windows perceptible without the old 400ms wait.
    animation = windowsIn, 1, $ds-2, hyprveilSoftOut, popin 94%
    animation = windowsOut, 1, $ds-1, hyprveilQuickEase, popin 96%

    # Tiling reflow tracks layout changes closely instead of lagging the hand.
    animation = windowsMove, 1, $ds-1, hyprveilQuickEase

    animation = border, 1, $ds-2, hyprveilQuickEase
    animation = fade, 1, $ds-2, hyprveilQuickEase
    animation = fadeIn, 1, $ds-2, hyprveilQuickEase
    animation = fadeOut, 1, $ds-1, hyprveilQuickEase
    animation = fadeSwitch, 1, $ds-1, hyprveilQuickEase
    animation = fadeDim, 1, $ds-2, hyprveilQuickEase
    animation = fadePopups, 1, $ds-1, hyprveilQuickEase

    # Layer surfaces are the shell: bar, dock, quick settings, wallpaper picker.
    # `slide` takes its direction from the layer's own anchor, so each panel
    # enters from the edge it lives on instead of fading in place. That
    # directionality is what makes the shell read as sitting above the desktop
    # rather than being composited into it.
    animation = layersIn, 1, $ds-2, hyprveilSoftOut, slide
    animation = layersOut, 1, $ds-1, hyprveilQuickEase, slide
    animation = fadeLayers, 1, $ds-1, hyprveilQuickEase

    # The wiki's travel percentage keeps workspace changes directional without
    # making the whole display sweep across the eye every time.
    animation = workspaces, 1, $ds-3, hyprveilSoftOut, slidefade 18%
    animation = specialWorkspace, 1, $ds-2, hyprveilSoftOut, slidefadevert 14%
}
