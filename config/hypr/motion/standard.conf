# Restrained spatial motion for windows, workspaces, layers, and the scratchpad.
bezier = hyprveilSoftOut, 0.16, 1, 0.3, 1
bezier = hyprveilQuickEase, 0.25, 0.1, 0.25, 1

animations {
    enabled = $hyprveil_animations_enabled

    animation = windows, 1, 3, hyprveilSoftOut, popin 90%
    animation = windowsOut, 1, 3, hyprveilSoftOut, popin 90%
    animation = border, 1, 4, hyprveilQuickEase
    animation = fade, 1, 3, hyprveilQuickEase
    animation = workspaces, 1, 3, hyprveilSoftOut, slide
    animation = layers, 1, 2, hyprveilQuickEase, fade
    animation = specialWorkspace, 1, 3, hyprveilSoftOut, slidevert
}
