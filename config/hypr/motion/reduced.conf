# Short fades with almost no scale or directional movement.
bezier = hyprveilReducedEase, 0.2, 0, 0, 1

animations {
    enabled = $hyprveil_animations_enabled

    animation = windows, 1, 1, hyprveilReducedEase, popin 99%
    animation = windowsOut, 1, 1, hyprveilReducedEase, popin 99%
    animation = border, 1, 1, hyprveilReducedEase
    animation = fade, 1, 2, hyprveilReducedEase
    animation = workspaces, 1, 1, hyprveilReducedEase, fade
    animation = layers, 1, 1, hyprveilReducedEase, fade
    animation = specialWorkspace, 1, 1, hyprveilReducedEase, fade
}
