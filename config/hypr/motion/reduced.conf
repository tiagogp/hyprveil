# Short fades with almost no scale or directional movement.
bezier = hyprveilReducedEase, $ease-reduced-points

animations {
    enabled = $hyprveil_animations_enabled

    animation = windows, 1, $ds-1, hyprveilReducedEase, popin 99%
    animation = windowsOut, 1, $ds-1, hyprveilReducedEase, popin 99%
    animation = border, 1, $ds-1, hyprveilReducedEase
    animation = fade, 1, $ds-2, hyprveilReducedEase
    animation = workspaces, 1, $ds-1, hyprveilReducedEase, fade
    animation = layers, 1, $ds-1, hyprveilReducedEase, fade
    animation = specialWorkspace, 1, $ds-1, hyprveilReducedEase, fade
}
