# Visual system: gaps, borders, rounding, blur, shadow. Values pulled from
# colors.conf and variables.conf — don't hardcode here.

general {
    gaps_in = $gaps-in
    gaps_out = $gaps-out
    border_size = $border-width
    col.active_border = $border-active
    col.inactive_border = $border
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = $rounding
    active_opacity = 1.0
    inactive_opacity = 0.96
    dim_strength = 0.45

    # Hyprland has one global shadow and no per-layer rule, so every window sits
    # at elevation tier 2; the rest of the ramp is an intra-panel system applied
    # by the GTK stylesheets. See docs/CONFIGURATION.md.
    shadow {
        enabled = true
        range = $shadow-range
        render_power = $shadow-power
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = $blur-size
        passes = $blur-passes
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = $blur-noise
        contrast = $blur-contrast
        brightness = $blur-brightness
    }
}

layerrule = blur, waybar
layerrule = blur, rofi
layerrule = blur, wofi
layerrule = blur, notifications
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = blur, logout_dialog
layerrule = ignorezero, waybar
layerrule = ignorezero, rofi
layerrule = ignorezero, logout_dialog
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = dimaround, rofi
layerrule = dimaround, logout_dialog

# logout_dialog draws its own backdrop and wlogout/style.css.in animates the
# buttons, so a compositor transform would move the dim along with the content —
# keep it fixed and let the contents carry the motion.
layerrule = noanim, logout_dialog

# rofi has no entrance of its own, so noanim made the launcher snap in. It is a
# dimaround (full-screen) surface, which rules out slide/popin — those would drag
# the dim across the screen. `fade` animates opacity only: the dim fades up with
# the panel, which reads as the launcher's entrance. Timing comes from the global
# fadeLayers curve in motion/*.conf, so it follows the active motion profile.
layerrule = animation fade, rofi
