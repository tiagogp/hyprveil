
general {
    gaps_in = $gaps-in
    gaps_out = $gaps-out
    border_size = $border-width

    col.active_border = $border-active
    col.inactive_border = $border

    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = $rounding

    active_opacity = 1.0
    inactive_opacity = 0.96
    # dim_strength was set here without dim_inactive = true, so it was inert —
    # focus is already carried by inactive_opacity and col.active_border above.
    # Re-add both keys together if inactive-window dimming is wanted later.

    # Hyprland uses one global window-shadow configuration.
    shadow {
        enabled = true
        range = $shadow-range
        render_power = $shadow-power
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = $blur-size
        passes = $blur-passes

        new_optimizations = true
        ignore_opacity = true
        xray = false

        noise = $blur-noise
        contrast = $blur-contrast
        brightness = $blur-brightness
    }
}

# All layerrule declarations live in window-rules.conf, to keep one file
# owning the concern instead of two drifting out of sync.
