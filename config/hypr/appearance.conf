
general {
    gaps_in = $gaps-in
    gaps_out = $gaps-out
    border_size = $border-width

    col.active_border = $border-active
    col.inactive_border = $border

    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = $rounding

    active_opacity = 1.0
    inactive_opacity = 0.96
    dim_strength = 0.45

    # Hyprland uses one global window-shadow configuration.
    shadow {
        enabled = true
        range = $shadow-range
        render_power = $shadow-power
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = $blur-size
        passes = $blur-passes

        new_optimizations = true
        ignore_opacity = true
        xray = false

        noise = $blur-noise
        contrast = $blur-contrast
        brightness = $blur-brightness
    }
}

# -----------------------------------------------------
# Waybar
# -----------------------------------------------------

layerrule = blur, ^(waybar)$
layerrule = ignorealpha 0.2, ^(waybar)$
layerrule = ignorezero, ^(waybar)$

# -----------------------------------------------------
# Rofi
# -----------------------------------------------------

# Blur the content behind Rofi.
layerrule = blur, ^(rofi)$

# Do not calculate blur for almost-transparent pixels.
# Rofi's theme must still use a transparent or translucent background.
layerrule = ignorealpha 0.2, ^(rofi)$
layerrule = ignorezero, ^(rofi)$

# Dim the desktop behind the launcher.
layerrule = dimaround, ^(rofi)$

# Fade the Rofi layer without moving its fullscreen dim surface.
layerrule = animation fade, ^(rofi)$

# -----------------------------------------------------
# Wofi
# -----------------------------------------------------

layerrule = blur, ^(wofi)$
layerrule = ignorealpha 0.2, ^(wofi)$
layerrule = ignorezero, ^(wofi)$

# -----------------------------------------------------
# Notifications
# -----------------------------------------------------

layerrule = blur, ^(notifications)$
layerrule = ignorealpha 0.2, ^(notifications)$
layerrule = ignorezero, ^(notifications)$

layerrule = blur, ^(swaync-control-center)$
layerrule = ignorealpha 0.2, ^(swaync-control-center)$
layerrule = ignorezero, ^(swaync-control-center)$

layerrule = blur, ^(swaync-notification-window)$
layerrule = ignorealpha 0.2, ^(swaync-notification-window)$
layerrule = ignorezero, ^(swaync-notification-window)$

# -----------------------------------------------------
# Logout dialog
# -----------------------------------------------------

layerrule = blur, ^(logout_dialog)$
layerrule = ignorealpha 0.2, ^(logout_dialog)$
layerrule = ignorezero, ^(logout_dialog)$
layerrule = dimaround, ^(logout_dialog)$

# The logout dialog draws its own backdrop, while its stylesheet animates
# the buttons. Disabling compositor animation keeps the backdrop fixed.
layerrule = noanim, ^(logout_dialog)$
