# The neutral palette — the single source of truth for every non-accent color.
# Format: rgba(RRGGBBAA), one `$name = value` per line, the same grammar the
# renderer parses. This is the counterpart to accent.conf: the accent is derived
# from the wallpaper, the neutrals are fixed design values, and both have to
# reach formats that cannot read a Hyprland variable (starship's TOML, hyprlock).
# scripts/lib/render-lib.sh `load_palette` reads this file so `starship.toml.in`
# can carry `@bg@`, `@text@`, `@warning@`, … placeholders, and hyprlock sources
# it directly. Edit a neutral here, then run
# `~/.config/hypr/scripts/accent.sh render` — do not hand-edit the generated
# consumers. See docs/CONFIGURATION.md.

# Rev 02 ("MU-TH-UR // floating HUD") warm-neutral palette — replaces the
# earlier cool-blue-black scheme. $text/$text-muted are lightened past the
# reference design doc's literal C4C0B6/6E6E76: a warm palette's muted gray reads
# darker per WCAG's channel weights than a cool gray at the same eyeballed
# brightness, and 6E6E76 alone only cleared 3.94:1 against the new $bg — under
# the 4.5:1 floor $text-muted is held to everywhere it draws body-sized text
# (window titles, notification bodies, tooltips). 96969e clears 4.5:1 against
# both $bg and $bg-surface, and against the adaptive chrome ceiling over white.
# The design's own 6E6E76 survives as Tokens.dim/CHROME_DIM — a lower,
# non-body-text tier already exempt from that floor (see tokens.conf/Tokens.qml).
$bg            = rgba(09090bff)
$bg-surface    = rgba(121216ff)
$bg-elevated   = rgba(18181cff)
$bg-deep       = rgba(060607ff)
$text          = rgba(c4c0b6ff)
$text-muted    = rgba(96969eff)
$border        = rgba(2a2a31ff)
$warning       = rgba(c29a5eff)
$error         = rgba(c4574aff)
$success       = rgba(7fb89fff)

# Chrome-specific surface tints and interactive states. Previously hardcoded
# per-component in the bar/dock QML; named here so they're a design decision
# instead of a repeated literal.
$chrome-tint         = rgba(101013ff)
$chrome-tint-media   = rgba(121215ff)
$state-hover-surface = rgba(232328ff)
