# Lock screen from the design mockup: near-black backdrop, oversized thin clock,
# accent avatar ring, pill password field.
# Neutrals are hardcoded here (hyprlock does not read colors.conf), but the
# accent is sourced from the generated accent.conf so the lock screen tracks the
# wallpaper along with everything else. See docs/ACCENT.md.

source = ~/.config/hypr/accent.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(0d0e11ff)
}

# 10:42 — oversized, light weight
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = Geist Light
    font_size = 104
    color = rgba(f5f5f7ff)
    position = 0, 200
    halign = center
    valign = center
}

# Friday, July 17
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_family = Geist
    font_size = 17
    color = rgba(9a9ca5ff)
    position = 0, 118
    halign = center
    valign = center
}

# avatar ring — accent circle with user initial
shape {
    monitor =
    size = 76, 76
    rounding = -1
    color = $accent-soft
    border_size = 2
    border_color = $accent
    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] sh -c 'printf %s "$USER" | cut -c1 | tr a-z A-Z'
    font_family = Geist
    font_size = 26
    color = $accent
    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = Geist
    font_size = 14
    color = rgba(f5f5f7ff)
    position = 0, -48
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    rounding = 23
    outline_thickness = 1
    outer_color = rgba(ffffff1f)
    inner_color = rgba(ffffff0f)
    font_color = rgba(f5f5f7ff)
    placeholder_text = <span foreground="##6b6e78">Enter password</span>
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    check_color = rgba(e1a346ff)
    fail_color = rgba(e5484dff)
    fail_text = <span foreground="##e5484d">Wrong password</span>
    position = 0, -120
    halign = center
    valign = center
}
