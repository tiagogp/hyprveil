# Lock screen from the design mockup: blurred/dimmed backdrop, oversized thin
# clock, accent avatar ring, pill password field.
# hyprlock cannot read colors.conf, but it can `source` the same neutrals.conf
# every other consumer uses, so the neutrals are named vars here rather than
# hardcoded hex. Sizes come from tokens.conf and the accent from the generated
# accent.conf, so the lock screen tracks the palette, the scale, and the
# wallpaper along with everything else. The only literals left are the white
# input washes and the pango `##hex` spans, which pango needs as raw hex.
# See docs/CONFIGURATION.md.

source = ~/.config/hypr/tokens.conf
source = ~/.config/hypr/neutrals.conf
source = ~/.config/hypr/accent.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = $bg-deep
    blur_passes = $lock-blur-passes
    blur_size = $blur-size
    noise = $lock-blur-noise
    contrast = $lock-blur-contrast
    brightness = $lock-blur-brightness
    vibrancy = 0.15
    vibrancy_darkness = 0.25
}

# 10:42 — oversized, light weight
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = Geist Light
    font_size = $text-clock
    color = $text
    position = 0, 200
    halign = center
    valign = center
}

# Friday, July 17
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_family = Geist
    font_size = $text-lg
    color = $text-muted
    position = 0, 118
    halign = center
    valign = center
}

# avatar ring — accent circle with user initial
shape {
    monitor =
    size = 76, 76
    rounding = -1
    color = $accent-soft
    border_size = $space-hair
    border_color = $accent
    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] sh -c 'printf %s "$USER" | cut -c1 | tr a-z A-Z'
    font_family = Geist
    font_size = $text-avatar
    color = $accent
    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = Geist
    font_size = $text-md
    color = $text
    position = 0, -48
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    rounding = -1
    outline_thickness = 1
    font_family = Geist
    outer_color = rgba(ffffff1f)
    inner_color = rgba(ffffff0f)
    font_color = $text
    placeholder_text = <span foreground="##6e6e76">Enter password</span>
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    check_color = $warning
    fail_color = $error
    fail_text = <span foreground="##c4574a">Wrong password</span>
    position = 0, -120
    halign = center
    valign = center
}
