# Keybind scheme ported from end-4/dots-hyprland (the parts that don't need
# Quickshell), adapted to hyprveil's tools: Rofi, the selected notification
# backend, and wlogout.
# Sections mirror end-4's: Apps / Utilities / Media / Window / Workspace / Session.

$mod = SUPER
$terminal = kitty
$launcher = pkill rofi || rofi -show drun
$fileManager = nautilus
$browser = firefox
$editor = code
$locker = loginctl lock-session
$powermenu = ~/.config/wlogout/power-menu.sh

##! Apps
bind = $mod, Return, exec, $terminal
bind = $mod, T, exec, $terminal
bind = CTRL ALT, T, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, W, exec, $browser
bind = $mod, C, exec, $editor
bind = CTRL SHIFT, Escape, exec, $terminal -e btop

##! Launcher — tap Super alone, or SUPER+Space
bindr = $mod, SUPER_L, exec, $launcher
bind = $mod, Space, exec, $launcher
bind = $mod, Tab, exec, pkill rofi || rofi -show window

##! Utilities (end-4 cluster: screenshot / OCR / color picker / clipboard / emoji)
bindl = , Print, exec, grim - | wl-copy
bindl = CTRL, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/Screenshot_"$(date +%Y-%m-%d_%H.%M.%S)".png && grim - | wl-copy
bind = $mod SHIFT, S, exec, pidof slurp || grim -g "$(slurp)" - | wl-copy
bind = $mod SHIFT, X, exec, pidof slurp || grim -g "$(slurp)" - | tesseract stdin stdout | wl-copy
bind = $mod SHIFT, C, exec, hyprpicker -a
bind = $mod, V, exec, pkill rofi || cliphist list | rofi -dmenu -p "clipboard" | cliphist decode | wl-copy
bind = $mod, Period, exec, pkill rofi || rofimoji
bind = $mod, N, exec, ~/.config/hypr/scripts/notification-daemon.sh toggle
bind = $mod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh pick

##! Screen zoom (end-4: SUPER+minus/equal)
binde = $mod, minus, exec, ~/.config/hypr/scripts/zoom.sh -0.3
binde = $mod, equal, exec, ~/.config/hypr/scripts/zoom.sh 0.3

##! Media (playerctl + wpctl, all work while locked)
bindl = $mod SHIFT, P, exec, playerctl play-pause
bindl = $mod SHIFT, N, exec, playerctl next
bindl = $mod SHIFT, B, exec, playerctl previous
bindl = $mod SHIFT, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = $mod ALT, M, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 2%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/hardware-action.sh brightness-up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/hardware-action.sh brightness-down

##! Window
bind = $mod, Q, killactive
bind = $mod SHIFT ALT, Q, exec, hyprctl kill
bind = $mod ALT, Space, togglefloating
bind = $mod, F, fullscreen
bind = $mod, D, fullscreen, 1
bind = $mod, P, pin
bind = $mod ALT, P, pseudo
bind = $mod, J, togglesplit
binde = $mod, semicolon, splitratio, -0.1
binde = $mod, apostrophe, splitratio, +0.1

# focus movement
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# window movement within tiling layout
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# mouse: move/resize floating windows
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

##! Workspace
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# send to workspace without following (end-4: SUPER+ALT+number)
bind = $mod ALT, 1, movetoworkspacesilent, 1
bind = $mod ALT, 2, movetoworkspacesilent, 2
bind = $mod ALT, 3, movetoworkspacesilent, 3
bind = $mod ALT, 4, movetoworkspacesilent, 4
bind = $mod ALT, 5, movetoworkspacesilent, 5
bind = $mod ALT, 6, movetoworkspacesilent, 6
bind = $mod ALT, 7, movetoworkspacesilent, 7
bind = $mod ALT, 8, movetoworkspacesilent, 8
bind = $mod ALT, 9, movetoworkspacesilent, 9
bind = $mod ALT, 0, movetoworkspacesilent, 10

# cycle workspaces: keys and scroll wheel (end-4 style)
bind = $mod CTRL, right, workspace, r+1
bind = $mod CTRL, left,  workspace, r-1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# scratchpad (end-4: SUPER+S; GRAVE kept as alternate)
bind = $mod, S, togglespecialworkspace, scratchpad
bind = $mod, GRAVE, togglespecialworkspace, scratchpad
bind = $mod ALT, S, movetoworkspacesilent, special:scratchpad
bind = $mod SHIFT, GRAVE, movetoworkspace, special:scratchpad

# multi-monitor: move focus across screens
bind = $mod, bracketright, focusmonitor, +1
bind = $mod, bracketleft,  focusmonitor, -1

##! Session (end-4: lock via loginctl so hypridle stays the single lock path)
bind = $mod, L, exec, $locker
bindl = $mod SHIFT, L, exec, systemctl suspend
bind = $mod, Escape, exec, $powermenu
bind = CTRL ALT, Delete, exec, $powermenu
bind = $mod SHIFT, Q, exit
