# Centralized palette — dark neutrals + one accent. Edit the neutrals here.
# Format: rgba(RRGGBBAA). Every other .conf references these by name.
#
# The accent family is NOT edited here: accent.conf is generated from the
# current wallpaper by scripts/accent.sh and sourced below, so it overrides the
# design defaults declared here. `accent.sh reset` returns to those defaults.
# See docs/ACCENT.md.

$bg            = rgba(0f1115ff)
$bg-surface    = rgba(16181dff)
$bg-elevated   = rgba(1c1f26ff)
$text          = rgba(f5f5f7ff)
$text-muted    = rgba(9a9ca5ff)
$accent        = rgba(e14658ff)
$accent-hover  = rgba(e86a79ff)
$accent-soft   = rgba(e1465826)
$border        = rgba(2a2d35ff)
$border-active = rgba(e14658b3)
$warning       = rgba(e1a346ff)
$error         = rgba(e5484dff)
$success       = rgba(4cae80ff)

# Wallpaper-derived accent overrides. Kept last so it wins over the defaults
# above; ships with the design values so an unrendered checkout is unchanged.
source = ~/.config/hypr/accent.conf

# translucent variants for blur surfaces (terminal, launcher, notifications)
$bg-translucent   = rgba(0f1115e6)
$surface-translucent = rgba(16181dcc)
