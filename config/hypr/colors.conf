# Centralized palette — dark neutrals + one accent.
#
# The neutrals now live in neutrals.conf (the single source of truth every
# consumer reads); this file sources them and adds the accent design defaults.
# Edit a neutral in neutrals.conf, not here.
#
# The accent family is NOT edited here: accent.conf is generated from the
# current wallpaper by scripts/accent.sh and sourced below, so it overrides the
# design defaults declared here. `accent.sh reset` returns to those defaults.
# See docs/CONFIGURATION.md.

source = ~/.config/hypr/neutrals.conf

# Accent design defaults, overridden by the generated accent.conf below.
#
# ad7300, not the rev-02 mockup's literal #D99A3A: amber reads far brighter
# than red at the same OKLCH lightness (WCAG's channel weights favor green,
# which amber carries a lot of and crimson barely any), so D99A3A only holds
# 2.23:1 against Accent.accentFg's white glyphs — under the 3.0:1 floor
# accent-on-chrome glyphs are held to. ad7300 sits at the same OKLCH L/C/H
# family, darkened until white clears 3.0:1 (3.69:1, matching the old red's
# own 3.70:1 margin) — see accent.sh's DEFAULT_ACCENT for the derivation.
$accent        = rgba(ad7300ff)
$accent-hover  = rgba(c78b2eff)
$accent-soft   = rgba(ad730026)
$border-active = rgba(ad7300b3)

# Wallpaper-derived accent overrides. Kept last so it wins over the defaults
# above; ships with the design values so an unrendered checkout is unchanged.
source = ~/.config/hypr/accent.conf

# translucent variants for blur surfaces (terminal, launcher, notifications)
$bg-translucent   = rgba(09090be6)
$surface-translucent = rgba(121216cc)
