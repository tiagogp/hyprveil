# Design tokens — the single source of truth for every non-color value.
#
# Sourced first by hyprland.conf and read by hypr/scripts/theme.sh, which
# renders these into the components that cannot read a Hyprland variable (GTK
# CSS has @define-color but no length variables, so waybar/swaync/wlogout/GTK
# get their sizes baked in from `.in` templates instead). Colors live next door
# in colors.conf. See docs/CONFIGURATION.md.
#
# Values are stored UNITLESS. Each renderer appends px/ms/deciseconds for its
# target, because the same 10 has to reach Hyprland as `10`, CSS as `10px`, and
# QML as `10`. Never write a unit here — tests/p7-token-smoke.sh enforces it.
#
# Every line is `$name = value`. Nothing else belongs in this file; the parser
# and the guard test both assume that shape.

# ---------------------------------------------------------------------------
# Radius
# ---------------------------------------------------------------------------
# A 4px ramp whose step equals $space-1, which makes nesting concentric by
# construction: a $radius-md card inset by $space-1 inside a $radius-lg panel
# has corners parallel to its parent (18 - 4 = 14), and so on down the ramp.
# Four steps is exactly the nesting depth the UI has: panel > card > control >
# chip.
$radius-xs   = 6
$radius-sm   = 10
$radius-md   = 14
$radius-lg   = 18
$radius-pill = 999

# ---------------------------------------------------------------------------
# Spacing
# ---------------------------------------------------------------------------
# A 4px grid with three half-steps. The half-steps are not a compromise: 6 and
# 10 are values the design independently converged on in three separate files,
# and forcing them onto the grid would be a visual redesign smuggled in as a
# refactor. What kills drift is that this set is CLOSED — the guard test
# rejects any spacing value that is not a member.
#
# Rule: half-steps are legal for padding INSIDE a control. Margins, gaps, and
# grid spacing use full steps.
$space-hair = 2
$space-1    = 4
$space-1h   = 6
$space-2    = 8
$space-2h   = 10
$space-3    = 12
$space-4    = 16
$space-5    = 20
$space-6    = 24
$space-8    = 32

# ---------------------------------------------------------------------------
# Type
# ---------------------------------------------------------------------------
# Rev 02 ("MU-TH-UR // floating HUD") moves the shell's own UI font to the
# terminal face it always paired with $font-mono for code — the design leans
# on monospace for every readout, not just panes that already were monospace.
# $font-mono is left as IBM Plex Mono, the design's second face (frame 2a's
# helmet loads both families): still distinct enough from $font-ui to mark
# "this is literal text" (file paths, config snippets) against "this is UI".
$font-ui       = JetBrains Mono
$font-ui-icons = Symbols Nerd Font
$font-mono     = IBM Plex Mono

# Integer-only steps (~1.09-1.25 ratio, tightening at the small end as dense
# chrome should). Fractional sizes are avoided because GTK renders them
# inconsistently.
$text-2xs = 11
$text-xs  = 12
$text-sm  = 13
$text-md  = 14
$text-lg  = 16
$text-xl  = 20

# One-offs, named so they are not mistaken for scale steps.
$text-mono    = 12.5
$text-wlogout = 12.5
$text-avatar  = 26
$text-clock   = 104

# Whole hundreds only. GTK discards an ENTIRE stylesheet on a non-hundred
# weight, which is why tests/p5-smoke.sh already guards this.
$weight-regular  = 400
$weight-medium   = 500
$weight-semibold = 600
$weight-bold     = 700

# Icon glyph sizes are not type — a 16px icon and 16px text are different
# optical systems, and coupling them means fixing one breaks the other.
$icon-sm   = 15
$icon-md   = 18
$icon-lg   = 24
$icon-xl   = 32
$icon-hit  = 40
$icon-ring = 56

# ---------------------------------------------------------------------------
# Elevation
# ---------------------------------------------------------------------------
# Surface alpha, hairline opacity, and shadow move TOGETHER. Tiering alpha
# alone (what the design did before) is why nothing read as layered: the border
# brightens as the surface opacifies, and both signal proximity to the viewer.
#
# The opacity floor is also load-bearing for legibility — see the contrast
# budget in docs/CONFIGURATION.md. Tier 0 sits at 0.88 rather than a glassier 0.82
# because 0.82 puts muted text at 4.05:1 over a bright wallpaper, under the
# 4.5:1 floor.
#
# Hyprland has one global decoration.shadow and no per-layer shadow rule, so
# this ramp is an INTRA-PANEL system; windows sit at tier 2 permanently.
$elev-0-alpha  = 0.88
$elev-0-border = 0.10

# Rev 02 retunes the shadow Y-offset/blur pair on each tier to the mockup's
# own numbers — the alphas already matched (0.35/0.45/0.55) and are untouched.
# elev-1 is chrome's own spec ("0 8px 30px / 35%", frame 2b); elev-2 is the
# floating-widget spec shared by the dock, OSD, notifications, media, and
# quick settings ("0 12px 40px / 45%", frame 2e); elev-3 is reserved for the
# lock screen's single card, the one surface the mockup casts a heavier shadow
# under ("0 20px 60px / 55%", frame 2f).
$elev-1-alpha  = 0.92
$elev-1-border = 0.08
$elev-1-shadow-y     = 8
$elev-1-shadow-blur  = 30
$elev-1-shadow-alpha = 0.35

$elev-2-alpha  = 0.96
$elev-2-border = 0.14
$elev-2-shadow-y     = 12
$elev-2-shadow-blur  = 40
$elev-2-shadow-alpha = 0.45

$elev-3-alpha  = 0.96
$elev-3-border = 0.16
$elev-3-shadow-y     = 20
$elev-3-shadow-blur  = 60
$elev-3-shadow-alpha = 0.55

# Hyprland window shadow — the compositor's single tier, mapped to elev-2.
$shadow-range = 16
$shadow-power = 2

# Blur, applied to every glass layer.
#
# Hyprland has ONE global blur block and no per-layer size or passes — the only
# per-layer controls are the boolean-ish layerrules (blur, ignorealpha, xray).
# So the elevation ramp cannot be expressed in blur the way it is in alpha,
# border, and shadow; this is a single setting that every glass surface shares.
#
# Size carries the quality, passes carry the cost. Each pass is a full
# downsample/upsample round, so 2 -> 3 is roughly a 1.5x GPU bill; widening the
# kernel at the same pass count is close to free by comparison. 6/2 sits below
# the original 8/2 on purpose: with background_opacity dropped on the terminal,
# a narrower kernel lets more of the wallpaper stay legible through the glass
# instead of mushing it flat — the "see more of what's behind it" trade against
# "frosted opaque" that 8/2 and 10/3 both leaned the other way on.
$blur-size   = 6
$blur-passes = 2

# Blur finish. These were hardcoded in appearance.conf, which the file's own
# header forbids. Noise is the load-bearing one: a wide kernel over a smooth
# wallpaper gradient bands visibly, and a touch of grain is what hides it.
# 0.05 (up from 0.02) makes the grain itself a visible texture on the glass,
# not just anti-banding — still well under Hyprland's own 0.117 default.
# Contrast slightly above 1 keeps the blurred backdrop from flattening into mush
# under the surface alpha.
$blur-noise      = 0.05
$blur-contrast   = 1.1
$blur-brightness = 1.0

# Lock-screen blur intentionally diverges from the shared glass tuning above:
# an extra pass and lower contrast/brightness read better under the oversized
# clock text on hyprlock's full-bleed screenshot backdrop than the standard
# chrome blur would. Named explicitly rather than left as unexplained literals
# in hyprlock.conf.
$lock-blur-passes     = 3
$lock-blur-noise      = 0.02
$lock-blur-contrast   = 0.9
$lock-blur-brightness = 0.45

# Chrome (the bar and the dock) overrides its tier alpha, and the ceiling is set
# by the faintest TEXT it draws.
#
# This used to sit at 0.76, justified as "chrome carries no body text, so the
# floor is 3.0:1 for UI text." That reasoning was wrong twice over. WCAG's 3.0:1
# (SC 1.4.11) covers non-text UI components and graphics; the bar's window title
# and clock are text, at $text-sm = 13px, and regular-weight text below 18.66px
# is held to 4.5:1 by SC 1.4.3 no matter what surface it sits on. At 0.76 over a
# white strip muted landed at 3.08:1 — passing a floor that did not apply to it.
#
# 0.87 is, exactly as 0.76 was, the alpha a pure white strip under the bar
# demands — only now solved against the floor that actually applies. It is still
# the WORST CASE and still a hair under $elev-0-alpha, so chrome remains the one
# surface allowed below tier 0; it just earns that glass by MEASURING, dropping
# to $chrome-alpha-min over a dark wallpaper where the contrast is free.
#
# Glyphs drawn in the accent or in $text-dim are non-text components and are
# held to 3.0:1, which alpha alone could not deliver without pushing chrome to
# 0.97 (a solid slab). accent.sh lifts those two colours instead — see
# $accent-on-chrome in the generated Accent.qml.
#
# This is still the ONLY surface allowed to override its tier. Anything that
# renders a paragraph — quick settings, notification bodies — stays on its tier.
$chrome-alpha = 0.87

# The launcher's own alpha, intentionally below every tier above (including the
# chrome floor): rofi is shown briefly, centered, over `dimaround`'s scrim, so
# there is no legibility budget to hold — unlike chrome, which draws text.
# Stored as a bare percent number because rofi's rasi syntax wants `NN%`, not a
# 0-1 fraction.
$rofi-bg-alpha = 62

# The glassy end of the adaptive chrome range. accent.sh measures the wallpaper
# where the bar actually sits and solves for the LOWEST alpha that still keeps
# muted at 4.5:1, so a dark wallpaper gets a near-invisible bar and a bright one
# gets $chrome-alpha — the contrast floor holds either way, which a single fixed
# alpha could only do by pricing every wallpaper at the white one.
#
# The solved value bottoms out here rather than at 0. Against a dark enough
# wallpaper the math permits 0.00, but a bar with no fill at all stops reading
# as a surface: the workspace pills and the title lose the shape they sit on and
# the bar becomes glyphs floating on the desktop. This floor is a design
# minimum, not a contrast one.
$chrome-alpha-min = 0.38

# ---------------------------------------------------------------------------
# Motion
# ---------------------------------------------------------------------------
# Hyprland's animation unit is DECISECONDS, so the ms durations that must cross
# into motion/*.conf are multiples of 100. $dur-2 is CSS-only for that reason.
$dur-1  = 100
$dur-2  = 150
$dur-2h = 200
$dur-modal = 280
$dur-3  = 300
$dur-4  = 400

# Deciseconds for Hyprland's `animation =` lines.
#
# The decisecond unit is a HARD floor on compositor timing: 100ms is the
# smallest step that exists, so a duration like 350ms is not expressible there.
# Anything needing finer resolution has to live on the QML side, where $dur-*
# applies and $dur-2h fills the gap the ds grid cannot.
$ds-1 = 1
$ds-2 = 2
$ds-3 = 3
$ds-4 = 4

# Shared by Hyprland and, once rendered, by the GTK stylesheets — which used a
# plain `ease` before and so visibly disagreed with the compositor.
$ease-out-points      = 0.16, 1, 0.3, 1
$ease-modal-points    = 0.28, 0.72, 0, 1
$ease-standard-points = 0.25, 0.1, 0.25, 1
$ease-reduced-points  = 0.2, 0, 0, 1

# A back/overshoot curve for modal entrances: the dialog scales a touch past its
# resting size and settles, which is what makes the card read as arriving rather
# than fading up. The y > 1 on the first handle is the overshoot; it is only
# ever put on a transform, never on opacity (which clamps at 1 and would just
# hold a flat spot). Valid as a Hyprland `bezier =` too, should a layer ever want
# it — see render-lib.sh, which derives the QML/CSS forms from these points.
$ease-bloom-points    = 0.34, 1.45, 0.6, 1
