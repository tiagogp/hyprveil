# Floating rules for dialogs, pickers, PiP, and small utility windows.

# The bar's Bluetooth, network, and volume glyphs open this — class is
# org.gnome.Settings, NOT gnome-control-center. Sized because the settings
# window opens narrow enough to hide the sidebar when it is floated.
windowrulev2 = float, class:^(org\.gnome\.Settings)$
windowrulev2 = size 1000 700, class:^(org\.gnome\.Settings)$
# Kept for manual launches; nothing in the config opens these any more.
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save As)$
windowrulev2 = float, title:^(File Upload)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$

# Picture-in-picture: float, pin, keep small, bottom-right corner
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-500 100%-300, title:^(Picture-in-Picture)$

# Scratchpad terminal (see keybindings.conf SUPER+GRAVE)
windowrulev2 = float, class:^(scratchpad)$
windowrulev2 = size 70% 60%, class:^(scratchpad)$
windowrulev2 = center, class:^(scratchpad)$

# Quick-settings panel + notification popups: glass blur to match the shell.
layerrule = blur, hyprveil-quicksettings
layerrule = ignorealpha 0.2, hyprveil-quicksettings
layerrule = blur, hyprveil-notifications
layerrule = ignorealpha 0.2, hyprveil-notifications
layerrule = blur, hyprveil-wallpapers
# 0.6, not the 0.2 every other surface uses. ignorealpha is a THRESHOLD, and a
# fading layer sweeps every pixel's alpha up through it: the scrim sits at 0.5,
# so at 0.2 it crossed mid-fade and the entire screen snapped from unblurred to
# blurred partway through the entrance. 0.6 sits above the scrim and below the
# dialog's 0.96, so the backdrop is never blurred at any point in the animation
# and only the card carries glass — which is the only place it was visible
# anyway, a 50% dim showing very little of what is behind it.
layerrule = ignorealpha 0.6, hyprveil-wallpapers
# The global `layersIn` is a slide, which is right for a panel anchored to one
# edge and wrong for a full-screen modal: the surface IS the scrim, so sliding
# it drags the dim across the screen and the desktop is briefly half-covered.
# Disable the compositor animation entirely; the dialog's own entrance is
# animated inside the QML instead (Panel/Wallpapers.qml).
layerrule = noanim, hyprveil-wallpapers

# Quickshell shell surfaces. Without these the panels render as flat fills —
# the glass is the compositor's, not the toolkit's, so a surface Hyprland has no
# blur rule for simply does not have the look no matter what the QML says.
#
# hyprveil-notifications is shared with the popup stack above: both draw the
# same surface and only one runs at a time, so one rule covers whichever it is.
layerrule = blur, hyprveil-bar
layerrule = ignorealpha 0.2, hyprveil-bar
layerrule = blur, hyprveil-media-preview
layerrule = ignorealpha 0.2, hyprveil-media-preview
layerrule = blur, hyprveil-dock
layerrule = ignorealpha 0.2, hyprveil-dock
layerrule = blur, hyprveil-osd
layerrule = ignorealpha 0.2, hyprveil-osd
# The dock's pin picker. A separate namespace from hyprveil-dock because it is a
# full-screen modal on the overlay layer, not the dock strip.
layerrule = blur, hyprveil-dock-pins
# Above the scrim's 0.5, below the dialog's 0.96 — see hyprveil-wallpapers.
layerrule = ignorealpha 0.6, hyprveil-dock-pins
# Same reason as hyprveil-wallpapers above: stationary scrim, moving dialog.
layerrule = noanim, hyprveil-dock-pins
# The keybind cheatsheet. Same shape as the two modals above and the same three
# rules for the same reasons.
layerrule = blur, hyprveil-cheatsheet
layerrule = ignorealpha 0.6, hyprveil-cheatsheet
layerrule = noanim, hyprveil-cheatsheet
