# Preferred applications used by the keybindings.
#
# `hyprveil setup` regenerates this file from your saved choices, so it is
# overwritten on every deploy/update. To change an app permanently, run:
#   ./hyprveil setup --terminal kitty --browser firefox \
#       --file-manager nautilus --editor code
# or pick from installed desktop entries in the interactive setup flow.
# A one-off manual edit here survives until the next deploy or setup --ensure.

$terminal = kitty
$fileManager = nautilus
$browser = firefox
$editor = code
