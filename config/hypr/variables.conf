# Tunable spacing / motion values. Change these, not the logic in appearance.conf.

$gaps-in       = 6
$gaps-out      = 12
$border-width  = 2
$rounding      = 10
$anim-speed    = 1   # multiplier hint only — actual durations set per-curve in animations.conf

# Stage 3 theming env — cursor + Qt platform theme (installed by scripts/04).
# Harmless before Stage 3 runs: missing themes just fall back to defaults.
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# Hybrid GPU env vars — UNCOMMENT ONLY if you confirmed NVIDIA is one of the two GPUs.
# See README "Hybrid GPU" section before enabling.
# env = WLR_DRM_NO_ATOMIC,1
# env = WLR_NO_HARDWARE_CURSORS,1
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = LIBVA_DRIVER_NAME,nvidia
