# The override layer. Change these, not the logic in appearance.conf.
#
# Each value names a token from tokens.conf rather than repeating a number, so
# the desktop stays on the shared scale by default. Overriding is still a matter
# of writing a literal here — that is the point of this file — but doing so
# takes the affected surface off the scale, so prefer moving the token.

$gaps-in       = $space-2
$gaps-out      = $space-3
$border-width  = $space-hair
$rounding      = $radius-sm

# Stage 3 theming env — cursor + Qt platform theme (installed by scripts/04).
# Harmless before Stage 3 runs: missing themes just fall back to defaults.
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# GPU-specific workarounds are deliberately disabled for every hardware profile.
# See docs/HARDWARE.md before enabling any one of these individually.
# env = WLR_DRM_NO_ATOMIC,1
# env = WLR_NO_HARDWARE_CURSORS,1
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = LIBVA_DRIVER_NAME,nvidia
