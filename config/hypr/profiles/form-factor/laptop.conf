# Laptop profile. Touchpad defaults (natural scroll, tap-to-click,
# disable-while-typing) already apply globally via hyprland.conf's top-level
# input{} block, so there is nothing laptop-specific to override there.
#
# Idle timers for this form factor come from `hyprveil setup`, which seeds
# shorter lock/dpms/suspend defaults when it detects a battery (see
# scripts/10-first-run-setup.sh's detect_has_battery) — nothing to add here.
#
# Lid close: systemd-logind's own default (HandleLidSwitch=suspend) already
# suspends on lid close with no Hyprland involvement, and hypridle's
# before_sleep_cmd (hypridle.conf) locks before ANY suspend regardless of what
# triggered it — lid, idle timeout, or SUPER+SHIFT+L. So the common case needs
# nothing here either.
#
# The exception is clamshell/docked use: if you've set HandleLidSwitch to
# lock or ignore in /etc/systemd/logind.conf (typically done so the laptop
# stays awake on an external monitor with the lid shut), uncomment this to
# restore lid-close-to-suspend at the compositor level instead:
# bindl = , switch:on:Lid Switch, exec, systemctl suspend
#
# Add settings here only if a value should differ from the global default
# specifically on laptop form factors.
