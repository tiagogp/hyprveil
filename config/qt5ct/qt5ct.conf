; Qt5 apps only pick this up if QT_QPA_PLATFORMTHEME is set to qt5ct — the repo
; default is qt6ct (hypr/variables.conf) since most current apps are Qt6. Kept in
; sync with qt6ct.conf so switching the env var is all it takes.
; __HOME__ is expanded by scripts/04-install-fedora-theming.sh.
[Appearance]
color_scheme_path=__HOME__/.config/qt5ct/colors/hyprveil.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=default
style=Fusion

[Fonts]
fixed="Fira Code,11,-1,5,50,0,0,0,0,0,Regular"
general="Geist,11,-1,5,50,0,0,0,0,0,Regular"

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3
