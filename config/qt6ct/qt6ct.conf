; Qt6 apps read this via QT_QPA_PLATFORMTHEME=qt6ct (set in hypr/variables.conf).
; __HOME__ is expanded to your real home dir by scripts/04-install-fedora-theming.sh
; (qt6ct needs an absolute color_scheme_path). Tweak visually with the qt6ct app.
[Appearance]
color_scheme_path=__HOME__/.config/qt6ct/colors/hyprveil.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=default
style=Fusion

[Fonts]
fixed="Fira Code,11,-1,5,50,0,0,0,0,0,Regular"
general="Geist,11,-1,5,50,0,0,0,0,0,Regular"

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3
