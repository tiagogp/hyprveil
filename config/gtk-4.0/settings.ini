# GTK4/libadwaita apps (nautilus, gnome tools). libadwaita ignores theme names —
# the dark look comes from color-scheme (set by hypr/scripts/apply-theme.sh) and
# the palette from gtk.css next to this file.
[Settings]
gtk-application-prefer-dark-theme = true
gtk-icon-theme-name = Papirus-Dark
gtk-cursor-theme-name = Bibata-Modern-Classic
gtk-cursor-theme-size = 24
gtk-font-name = Geist 11
gtk-xft-antialias = 1
gtk-xft-hinting = 1
gtk-xft-hintstyle = hintslight
gtk-xft-rgba = rgb
