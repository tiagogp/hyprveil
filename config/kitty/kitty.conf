# Kitty — translucent glass terminal from the design mockup.
# Hyprland's decoration.blur handles the frosted look; opacity set here.

font_family      Fira Code
bold_font        Fira Code SemiBold
italic_font      auto
bold_italic_font auto
font_size        12.5

background_opacity      0.60
hide_window_decorations yes
window_padding_width    20 24
confirm_os_window_close 0
enable_audio_bell       no
cursor_shape            beam

# Palette mirror of hypr/colors.conf — keep in sync manually.
foreground #F5F5F7
background #0F1115

cursor            #E14658
cursor_text_color #0F1115

selection_background #2A2D35
selection_foreground #F5F5F7

url_color #E14658

# black
color0  #16181D
color8  #6B6E78
# red
color1  #E5484D
color9  #E14658
# green
color2  #4CAE80
color10 #5FC593
# yellow
color3  #E1A346
color11 #EBB668
# blue
color4  #7A9CC6
color12 #93B2D6
# magenta
color5  #B48EAD
color13 #C6A5C0
# cyan
color6  #6FADA8
color14 #8BC2BD
# white
color7  #9A9CA5
color15 #F5F5F7

tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_background   #E14658
active_tab_foreground   #F5F5F7
inactive_tab_background #1C1F26
inactive_tab_foreground #9A9CA5
