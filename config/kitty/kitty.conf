# Kitty — translucent glass terminal from the design mockup.
# Hyprland's decoration.blur handles the frosted look; opacity set here.

font_family      Fira Code
bold_font        Fira Code SemiBold
italic_font      auto
bold_italic_font auto
font_size        12.5

background_opacity      0.78
hide_window_decorations yes
window_padding_width    20 24
confirm_os_window_close 0
enable_audio_bell       no
cursor_shape            beam

# Palette mirror of hypr/colors.conf — keep in sync manually.
foreground #c4c0b6
background #09090b


cursor_text_color #09090b

selection_background #2a2a31
selection_foreground #c4c0b6


# black
color0  #121216
color8  #6e6e76
# red
color1  #c4574a

# green
color2  #7fb89f
color10 #5FC593
# yellow
color3  #c29a5e
color11 #EBB668
# blue
color4  #7A9CC6
color12 #93B2D6
# magenta
color5  #B48EAD
color13 #C6A5C0
# cyan
color6  #6FADA8
color14 #8BC2BD
# white
color7  #96969e
color15 #c4c0b6

tab_bar_style           powerline
tab_powerline_style     slanted

active_tab_foreground   #c4c0b6
inactive_tab_background #18181c
inactive_tab_foreground #96969e

# Optional helpers. They call Kitty's own tab/session features and keep terminal
# state out of Quickshell.
map ctrl+shift+t launch --type=tab --cwd=current --add-to-session=.
map ctrl+shift+r set_tab_title
map ctrl+shift+o launch --type=background ~/.config/kitty/hyprveil-session.sh save last
map ctrl+shift+p launch --type=background ~/.config/kitty/hyprveil-session.sh open last

# Accent-colored entries (cursor, url_color, color9, active_tab_background) are
# generated from the wallpaper into accent.conf. Keep this include last so it
# overrides anything above. See docs/CONFIGURATION.md.
include accent.conf
