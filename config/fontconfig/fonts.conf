<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<!--
  Font rendering for the whole session. This exists because leaving it to the
  distro default meant every toolkit rendered text differently: gtk-3.0 and
  gtk-4.0 settings.ini ask for hintslight + rgb, but those keys only describe
  what GTK requests — fontconfig is what actually rasterizes, and whatever it
  says wins. A stray rgba=none here silently overrode both GTK files and left
  grayscale-only antialiasing that read as "unantialiased" against the design.

  Keep the values below in sync with gtk-3.0/settings.ini and gtk-4.0/settings.ini.
-->
<fontconfig>
  <!-- Antialiasing on, subpixel (RGB stripe) with the default LCD filter.
       lcdfilter is not optional alongside rgba: without it subpixel rendering
       produces color fringing on stems rather than the extra effective
       horizontal resolution it exists to buy. -->
  <match target="font">
    <edit mode="assign" name="antialias"><bool>true</bool></edit>
    <edit mode="assign" name="rgba"><const>rgb</const></edit>
    <edit mode="assign" name="lcdfilter"><const>lcddefault</const></edit>
  </match>

  <!-- hintslight, not hintfull: slight keeps the glyph shapes the typeface was
       drawn with and only snaps stems vertically. hintfull distorts the
       geometry enough that Geist stops looking like Geist. -->
  <match target="font">
    <edit mode="assign" name="hinting"><bool>true</bool></edit>
    <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
  </match>

  <!-- Embedded bitmap strikes ship with some fonts at small sizes and are not
       antialiased at all. They are the one thing that can defeat every setting
       above, so they are refused outright. -->
  <match target="font">
    <edit mode="assign" name="embeddedbitmap"><bool>false</bool></edit>
  </match>

  <!-- The design's three families, bound to the generic aliases so that any app
       asking for a generic gets the themed face instead of the distro default
       (Noto Sans / Noto Sans Mono here). These mirror hypr/tokens.conf. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Geist</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Fira Code</family></prefer>
  </alias>

  <!-- Nerd Font glyphs are icons, not text: they must resolve for any family
       that hits an icon codepoint, which is why this is a global fallback
       rather than something each caller opts into. starship's prompt is the
       case that forces it — kitty sets no symbol_map, so the prompt's glyphs
       reach the terminal only through this fallback.

       Monospace gets the Mono variant specifically, and must be matched first:
       the proportional face advances by the glyph's own width, which in a
       terminal is not the cell width, so every icon in the prompt would shift
       the rest of the line. The Mono variant is pre-squashed to one cell. -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit mode="append" name="family"><string>Symbols Nerd Font Mono</string></edit>
  </match>
  <match target="pattern">
    <edit mode="append" name="family"><string>Symbols Nerd Font</string></edit>
  </match>
</fontconfig>
