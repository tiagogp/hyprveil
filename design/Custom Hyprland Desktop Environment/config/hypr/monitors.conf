# PLACEHOLDER — replace before first launch.
# Run `hyprctl monitors` (after any first boot, even with wrong config) or `wlr-randr`
# to get real names/resolutions/refresh rates, then edit below.
#
# Syntax: monitor = name, resolution@refresh, position, scale
#
# Example for a 2-monitor desktop with the primary on the left:
# monitor = DP-1, 2560x1440@144, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1
#
# If GPU is hybrid and one monitor is driven by the discrete GPU, you may need to
# prefix that monitor line differently — flag this once you confirm the GPU pairing.

monitor = , preferred, auto, 1
