# Fast, subtle motion. Soft ease-out curve throughout — nothing over ~220ms.

bezier = softOut, 0.16, 1, 0.3, 1
bezier = quickEase, 0.25, 0.1, 0.25, 1

animations {
    enabled = true

    animation = windows, 1, 3, softOut, popin 90%
    animation = windowsOut, 1, 3, softOut, popin 90%
    animation = border, 1, 4, quickEase
    animation = fade, 1, 3, quickEase
    animation = workspaces, 1, 3, softOut, slide
    animation = layers, 1, 2, quickEase, fade
    animation = specialWorkspace, 1, 3, softOut, slidevert
}
